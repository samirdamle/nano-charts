name: Release
on:
  push: { branches: [main] }
permissions: { contents: write, pull-requests: write, id-token: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      # pnpm + changesets publish has a documented failure mode where the
      # setup-node project .npmrc auth never reaches the registry PUT and
      # npm answers 404 (a bad/missing token also surfaces as 404, not
      # 401). Writing the token into $HOME/.npmrc makes the auth explicit
      # for both npm and pnpm. The runner is ephemeral, so nothing persists.
      - name: Write npm auth to $HOME/.npmrc
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            cat << EOF > "$HOME/.npmrc"
          //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: changesets/action@v1
        with: { publish: pnpm exec changeset publish }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
