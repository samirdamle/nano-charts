<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nano-charts</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --border-soft: #f0efec;
    --text: #1c1b1a;
    --text-muted: #6b6862;
    --text-faint: #a6a29a;
    --new-badge-bg: #eef2fb;
    --new-badge-text: #3a5dae;

    /* chalk theme: chart foreground colors on a blackboard chart area */
    --chalk-green: #8fe6c4;
    --chalk-cyan: #7fd8e6;
    --chalk-pink: #f3a8c7;
    --chalk-lilac: #c6a6e8;
    --chalk-yellow: #f0dd82;

    /* alternating light/dark pastel pair for stacked-bar segments */
    --chalk-stack-a: #f6c9dd;
    --chalk-stack-b: #7c6a99;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --border-soft: #26251f;
      --text: #f3f1ec;
      --text-muted: #a19d94;
      --text-faint: #6f6c64;
      --new-badge-bg: #23283a;
      --new-badge-text: #8ea6e0;
    }
  }

  /* chalk color theme utility classes */
  .chalk-green { color: var(--chalk-green); }
  .chalk-cyan { color: var(--chalk-cyan); }
  .chalk-pink { color: var(--chalk-pink); }
  .chalk-lilac { color: var(--chalk-lilac); }
  .chalk-yellow { color: var(--chalk-yellow); }
  .chalk-stack-a { color: var(--chalk-stack-a); }
  .chalk-stack-b { color: var(--chalk-stack-b); }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 32px 64px;
  }

  header.hero {
    margin-bottom: 32px;
  }
  header.hero h1 {
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  header.hero p {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text-muted);
    margin: 0;
    max-width: 46em;
  }

  section.group {
    margin-bottom: 28px;
  }
  .group-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .group-heading h2 {
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
    line-height: 1.4;
  }
  .card-head .badge {
    flex: none;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--new-badge-text);
    background: var(--new-badge-bg);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .chart {
    color: var(--chalk-green);
    background: #000000;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 96px;
  }
  .chart svg {
    width: 100%;
    height: auto;
    max-height: 96px;
    display: block;
    overflow: visible;
  }
  .chart-info {
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--border-soft);
    font-size: 13px;
    color: var(--text-faint);
  }
  footer code {
    background: var(--border-soft);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1 class="chalk-pink">Nano Charts - Tiny Minimal Charts</h1>
    <p>This is a demo of all the nano chart types with their variations. Nano charts is an open source, very light weight, pure JavaScript + SVG data visualization library.</p>
  </header>
  <div id="root"></div>
  <footer>Served from <code>dist/</code> via <code>toSVG()</code> — rebuild with <code>pnpm build:demo</code> to refresh.</footer>
</div>

<script type="module">
  import { line, lines, area, bar, winLoss, bullet, donut, scatter, heatmap, toSVG } from './dist/index.js';

  const root = document.getElementById('root');

  function group(title, entries) {
    const section = document.createElement('section');
    section.className = 'group';

    const heading = document.createElement('div');
    heading.className = 'group-heading';
    const h2 = document.createElement('h2');
    h2.className = 'chalk-yellow';
    h2.textContent = title;
    heading.append(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const { title: cardTitle, scene, fixed, interactive } of entries) {
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      const h3 = document.createElement('h3');
      h3.textContent = cardTitle;
      head.append(h3);
      if (fixed) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'Fixed';
        head.append(badge);
      }

      const chart = document.createElement('div');
      chart.className = 'chart';
      chart.innerHTML = toSVG(scene);

      card.append(head, chart);

      if (interactive) {
        const info = document.createElement('div');
        info.className = 'chart-info';
        const idleText = 'Hover or click a point';
        info.textContent = idleText;

        let selectedText = null;
        const describePoint = (indexAttr) => {
          const point = scene.points[Number(indexAttr)];
          return point ? `index ${point.index} — value ${point.value}` : null;
        };

        chart.addEventListener('pointermove', (event) => {
          const indexAttr = event.target?.dataset?.index;
          const desc = indexAttr === undefined ? null : describePoint(indexAttr);
          info.textContent = desc ? `Hovering: ${desc}` : (selectedText ?? idleText);
        });

        chart.addEventListener('pointerleave', () => {
          info.textContent = selectedText ?? idleText;
        });

        chart.addEventListener('click', (event) => {
          const indexAttr = event.target?.dataset?.index;
          if (indexAttr === undefined) return;
          const desc = describePoint(indexAttr);
          if (desc) {
            selectedText = `Selected: ${desc}`;
            info.textContent = selectedText;
          }
        });

        card.append(info);
      }

      grid.append(card);
    }

    section.append(heading, grid);
    root.append(section);
  }

  group('Line', [
    { title: 'Basic', scene: line([3, 7, 2, 9, 5, 6]) },
    { title: 'With dots', scene: line([3, 7, 2, 9, 5, 6], { dot: 'all' }) },
    { title: 'Single point — renders as a dot', scene: line([5]) },
    {
      title: 'Multiple series',
      scene: lines([
        { data: [7, 9, 6, 10, 8, 9], name: 'Revenue', color: 'var(--chalk-green)' },
        { data: [4, 5, 4, 6, 5, 6], name: 'Target', color: 'var(--chalk-cyan)', strokeDasharray: [3, 2] },
        { data: [1, 2, 1, 3, 2, 3], name: 'Forecast', color: 'var(--chalk-pink)', strokeWidth: 2.5 },
      ]),
    },
    {
      title: 'Hover & click',
      scene: line([3, 7, 2, 9, 5, 6], { dot: 'all', dotRadius: 2.5 }),
      interactive: true,
    },
  ]);

  group('Area', [
    { title: 'Basic', scene: area([23, 30, 18, 27, 33, 21, 29, 24, 34, 22]) },
    { title: 'Single point — renders as a dot', scene: area([5]) },
  ]);

  const barValues = [4, 9, 2, 7, 5, 8, 3, 6, 9, 4];
  const stackedBarPairs = [
    [3, 2], [5, 1], [2, 4], [6, 3], [4, 2],
    [7, 3], [3, 5], [5, 2], [2, 6], [6, 4],
  ];
  const stackColors = ['var(--chalk-stack-a)', 'var(--chalk-stack-b)'];

  group('Bar', [
    { title: 'Basic', scene: bar(barValues) },
    { title: 'Rounded caps', scene: bar(barValues, { radius: 4 }) },
    { title: 'Negative values', scene: bar([4, -3, 6, -2, 1, -5, 3, -4, 2, -1]) },
    {
      title: 'Horizontal, single bar (stacked)',
      scene: bar(
        [[
          { value: 3, color: 'var(--chalk-stack-a)' },
          { value: 5, color: 'var(--chalk-stack-b)' },
          { value: 2, color: 'var(--chalk-stack-a)' },
          { value: 4, color: 'var(--chalk-stack-b)' },
        ]],
        { horizontal: true },
      ),
    },
    { title: 'Horizontal, multiple bars', scene: bar(barValues, { horizontal: true }) },
    {
      title: 'Horizontal, multiple bars (stacked)',
      scene: bar(
        stackedBarPairs.map((pair) => pair.map((value, row) => ({ value, color: stackColors[row] }))),
        { horizontal: true },
      ),
    },
  ]);

  group('Win / Loss', [
    { title: 'Basic', scene: winLoss([1, -2, 3, -1, 2, -3]) },
  ]);

  group('Bullet', [
    { title: 'Basic', scene: bullet({ value: 80, target: 90, ranges: [50, 75, 100] }) },
  ]);

  group('Donut', [
    { title: 'Gauge', scene: donut({ value: 75, max: 100 }) },
    { title: 'Full circle', scene: donut({ value: 100, max: 100 }) },
    { title: 'Segments (categorical palette)', scene: donut([4, 3, 2, 1, 1]) },
    {
      title: 'Segments (explicit colors)',
      scene: donut([
        { value: 4, label: 'Chrome', color: 'var(--chalk-green)' },
        { value: 3, label: 'Safari', color: 'var(--chalk-cyan)' },
        { value: 2, label: 'Firefox', color: 'var(--chalk-lilac)' },
      ]),
    },
    { title: 'Round caps', scene: donut({ value: 75, max: 100 }, { strokeLinecap: 'round' }) },
  ]);

  group('Scatter', [
    { title: 'Basic', scene: scatter([[0, 0], [3, 8], [6, 2], [10, 10]]) },
  ]);

  group('Heatmap', [
    { title: 'Basic', scene: heatmap([[1, 4, 2], [3, 0, 5], [2, 6, 1]], { cellSize: 20, gap: 2 }) },
    { title: 'Ragged rows — no longer throws', scene: heatmap([[1, 4, 2], [3, 0], [2, 6, 1, 5]], { cellSize: 20, gap: 2 }), fixed: true },
  ]);
</script>
</body>
</html>
